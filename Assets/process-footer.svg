<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Process engineering, operations and logistics animation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A1AFF"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="180" fill="url(#bg)"/>

  <!-- Fluxo de processo -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">
    <g>
      <rect x="80" y="14" width="150" height="34" rx="6" fill="#0b1030" fill-opacity="0.55" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="80" y="14" width="150" height="34" rx="6" fill="#fff" fill-opacity="0.1">
        <animate attributeName="fill-opacity" values="0.1;0.5;0.1;0.1;0.1" keyTimes="0;0.125;0.25;0.5;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="155" y="36">INPUT</text>
    </g>
    <g>
      <rect x="310" y="14" width="150" height="34" rx="6" fill="#0b1030" fill-opacity="0.55" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="310" y="14" width="150" height="34" rx="6" fill="#fff" fill-opacity="0.1">
        <animate attributeName="fill-opacity" values="0.1;0.1;0.5;0.1;0.1" keyTimes="0;0.25;0.375;0.5;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="385" y="36">PROCESS</text>
    </g>
    <g>
      <rect x="540" y="14" width="150" height="34" rx="6" fill="#0b1030" fill-opacity="0.55" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="540" y="14" width="150" height="34" rx="6" fill="#fff" fill-opacity="0.1">
        <animate attributeName="fill-opacity" values="0.1;0.1;0.5;0.1;0.1" keyTimes="0;0.5;0.625;0.75;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="615" y="36">QUALITY</text>
    </g>
    <g>
      <rect x="770" y="14" width="150" height="34" rx="6" fill="#0b1030" fill-opacity="0.55" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="770" y="14" width="150" height="34" rx="6" fill="#fff" fill-opacity="0.1">
        <animate attributeName="fill-opacity" values="0.1;0.1;0.5;0.1" keyTimes="0;0.75;0.875;1" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="845" y="36">SHIPPING</text>
    </g>
  </g>

  <!-- Setas entre etapas -->
  <g stroke="#fff" stroke-width="2.5" stroke-dasharray="6 6" fill="none">
    <line x1="234" y1="31" x2="306" y2="31"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></line>
    <line x1="464" y1="31" x2="536" y2="31"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></line>
    <line x1="694" y1="31" x2="766" y2="31"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1s" repeatCount="indefinite"/></line>
  </g>

  <!-- Engrenagens -->
  <g>
    <circle cx="140" cy="92" r="15" fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="5.9 5.9">
      <animateTransform attributeName="transform" type="rotate" from="0 140 92" to="360 140 92" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="92" r="10" fill="#0b1030" fill-opacity="0.7" stroke="#fff" stroke-width="2"/>
    <circle cx="140" cy="92" r="3" fill="#fff"/>

    <circle cx="176" cy="104" r="11" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="6" stroke-dasharray="4.3 4.3">
      <animateTransform attributeName="transform" type="rotate" from="360 176 104" to="0 176 104" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="104" r="7" fill="#0b1030" fill-opacity="0.7" stroke="#fff" stroke-width="2"/>
    <circle cx="176" cy="104" r="2.5" fill="#fff"/>
  </g>

  <!-- Texto central -->

  <!-- Gráfico de indicadores (KPI) -->
  <g fill="#fff">
    <line x1="790" y1="125" x2="910" y2="125" stroke="#fff" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="800" y="105" width="14" height="20" fill-opacity="0.9">
      <animate attributeName="height" values="20;38;26;44;20" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="105;87;99;81;105" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="822" y="95" width="14" height="30" fill-opacity="0.75">
      <animate attributeName="height" values="30;24;40;32;30" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="95;101;85;93;95" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="844" y="90" width="14" height="35" fill-opacity="0.9">
      <animate attributeName="height" values="35;46;30;40;35" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="90;79;95;85;90" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="866" y="80" width="14" height="45" fill-opacity="0.75">
      <animate attributeName="height" values="45;36;50;42;45" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;89;75;83;80" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="888" y="72" width="14" height="53" fill-opacity="0.9">
      <animate attributeName="height" values="53;48;58;50;53" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="72;77;67;75;72" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Esteira -->
  <rect y="138" width="1000" height="6" fill="#0b1030" fill-opacity="0.9"/>
  <rect y="144" width="1000" height="16" fill="#0b1030" fill-opacity="0.8"/>
  <line x1="0" y1="152" x2="1000" y2="152" stroke="#fff" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="16 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="0.7s" repeatCount="indefinite"/>
  </line>
  <rect y="160" width="1000" height="20" fill="#0b1030" fill-opacity="0.95"/>
  <g fill="#fff" fill-opacity="0.35">
    <rect x="60" y="160" width="6" height="20"/>
    <rect x="260" y="160" width="6" height="20"/>
    <rect x="460" y="160" width="6" height="20"/>
    <rect x="660" y="160" width="6" height="20"/>
    <rect x="860" y="160" width="6" height="20"/>
  </g>

  <!-- Caixas na esteira -->
  <g>
    <g transform="translate(-60,114)">
      <animateTransform attributeName="transform" type="translate" from="-60 114" to="1060 114" dur="12s" begin="0s" repeatCount="indefinite"/>
      <rect width="38" height="24" rx="2" fill="#fff"/>
      <rect x="15" width="8" height="24" fill="#00E5FF"/>
    </g>
    <g transform="translate(-60,114)">
      <animateTransform attributeName="transform" type="translate" from="-60 114" to="1060 114" dur="12s" begin="-3s" repeatCount="indefinite"/>
      <rect width="38" height="24" rx="2" fill="#00E5FF"/>
      <rect x="15" width="8" height="24" fill="#fff"/>
    </g>
    <g transform="translate(-60,114)">
      <animateTransform attributeName="transform" type="translate" from="-60 114" to="1060 114" dur="12s" begin="-6s" repeatCount="indefinite"/>
      <rect width="38" height="24" rx="2" fill="#fff"/>
      <rect x="15" width="8" height="24" fill="#00E5FF"/>
    </g>
    <g transform="translate(-60,114)">
      <animateTransform attributeName="transform" type="translate" from="-60 114" to="1060 114" dur="12s" begin="-9s" repeatCount="indefinite"/>
      <rect width="38" height="24" rx="2" fill="#00E5FF"/>
      <rect x="15" width="8" height="24" fill="#fff"/>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
